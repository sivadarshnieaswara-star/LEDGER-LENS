<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LedgerLens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --canvas: #efeeec; --panel: #ffffff; --ink: #17181a; --ink-2: #3c3f44; --muted: #6b6f76;
  --line: #ebeae7; --row: #f7f7f6; --nav-active: #dbd1c6;
  --accent: #d64511; --accent-ink: #fff; --accent-soft: #fdeee7;
  --navy: #0e2747; --navy-ink: #b9d3f5;
  --high: #c0261b; --high-soft: #fdecea; --med: #a35f00; --med-soft: #fdf2df;
  --low: #50606f; --low-soft: #edf1f5; --ok: #23843f; --ok-soft: #e7f4ea;
  --shadow: 0 1px 2px rgba(20,20,20,.05), 0 4px 18px rgba(20,20,20,.05);
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --hover: #f0eeeb; --logo: #17181a;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --canvas: #0f1012; --panel: #18191c; --ink: #ecebe8; --ink-2: #c9c8c4; --muted: #8f939a;
  --line: #2a2c30; --row: #1e2023; --nav-active: #3a332c; --hover: #25272b; --logo: #ecebe8;
  --accent: #f0652f; --accent-soft: #3a2117;
  --high: #ff8a80; --high-soft: #3b1d1b; --med: #f5b955; --med-soft: #3a2d17;
  --low: #a9b8c7; --low-soft: #222a32; --ok: #6fd28d; --ok-soft: #173022;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 18px rgba(0,0,0,.25);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--canvas); color: var(--ink); font: 14px/1.45 Figtree, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
button { font: inherit; color: inherit; }
.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); gap: 16px; padding: 16px; min-height: 100vh; }
.app.collapsed { grid-template-columns: 76px minmax(0, 1fr); }

/* sidebar */
.side { background: var(--panel); border-radius: 16px; padding: 22px 14px 16px; display: flex; flex-direction: column;
  position: sticky; top: 16px; height: calc(100vh - 32px); overflow: auto; }
.logo { display: flex; align-items: center; gap: 10px; padding: 0 8px 26px; font-weight: 700; font-size: 17px; letter-spacing: -.02em; }
.logo svg { flex: none; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav a, .nav button.navrow { display: flex; align-items: center; gap: 12px; padding: 9px 14px; border-radius: 10px; color: var(--ink-2);
  text-decoration: none; font-weight: 500; border: 0; background: none; cursor: pointer; text-align: left; width: 100%; }
.nav a:hover { background: var(--row); }
.nav a.on { background: var(--nav-active); color: var(--ink); font-weight: 600; }
.nav svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.nav .count { margin-left: auto; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 700;
  padding: 1px 7px; border-radius: 999px; }
.nav .group { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 10px; }
.nav .group a { padding: 11px 14px; }
.nav .chev { margin-left: auto; opacity: .7; }
.side .foot { margin-top: auto; display: flex; justify-content: flex-end; padding-top: 16px; }
.collapse { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--row); cursor: pointer; display: grid; place-items: center; }
.collapsed .side .label, .collapsed .side .count, .collapsed .side .chev, .collapsed .logo span { display: none; }
.collapsed .collapse svg { transform: rotate(180deg); }

/* main */
.main { background: var(--panel); border-radius: 16px; padding: 28px 18px 40px; min-width: 0; }
.head { padding: 0 14px; margin-bottom: 22px; display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.head h1 { font-size: 20px; font-weight: 600; margin: 0 0 14px; letter-spacing: -.01em; }
.head p { margin: 0; font-weight: 500; font-size: 15px; color: var(--ink-2); }
.head .grow { flex: 1; }
.crumb { color: var(--muted); font-weight: 500; text-decoration: none; display: inline-flex; gap: 6px; align-items: center; margin-bottom: 10px; }
.crumb:hover { color: var(--ink); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; margin-bottom: 18px; }
.kpi { background: var(--panel); border-radius: 12px; box-shadow: var(--shadow); padding: 26px 18px 24px; }
.kpi .l { color: var(--muted); font-size: 15px; margin-bottom: 14px; }
.kpi .v { font-size: 22px; font-weight: 700; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.kpi .s { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
.card { background: var(--panel); border-radius: 12px; box-shadow: var(--shadow); padding: 22px 16px 16px; margin-bottom: 18px; }
.card > h2 { font-size: 17px; font-weight: 600; margin: 0 8px 18px; display: flex; align-items: center; gap: 10px; }
.card > h2 .sub { color: var(--muted); font-weight: 400; font-size: 13.5px; }
.tbox { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.filters { display: flex; align-items: center; gap: 8px; padding: 10px 12px; flex-wrap: wrap; position: relative; }
.filters .lbl { color: var(--ink-2); font-size: 15px; margin-right: 2px; }
.fchip { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 6px; padding: 5px 9px; font-size: 15px; cursor: pointer; }
.fchip.ghost { background: var(--accent-soft); color: var(--accent); }
.fchip .n { background: rgba(255,255,255,.25); border-radius: 4px; padding: 0 5px; margin-left: 6px; font-size: 12px; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 11px; font-size: 13px; cursor: pointer; }
.chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.chip .n { opacity: .65; margin-left: 4px; }
.pop { position: absolute; top: 46px; z-index: 20; background: var(--panel); border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.14);
  border: 1px solid var(--line); padding: 10px; min-width: 260px; }
.pop label { display: flex; gap: 8px; align-items: center; padding: 6px 4px; cursor: pointer; }
.pop .row { display: flex; gap: 8px; align-items: center; padding: 4px; }
.pop .actions { display: flex; justify-content: space-between; padding: 8px 4px 2px; }
input[type=search], input[type=text], input[type=date], textarea, select { font: inherit; color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
input[type=search] { min-width: 240px; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 600; font-size: 15px; padding: 14px 12px; }
td { padding: 0 12px; height: 64px; vertical-align: middle; }
tbody tr:nth-child(odd) td { background: var(--row); }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: var(--hover); }
tbody tr.sel td { background: var(--accent-soft) !important; }
.bulkbar { position: sticky; top: 8px; z-index: 10; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  background: var(--ink); color: var(--panel); padding: 10px 14px; border-radius: 10px; margin: 0 0 12px; }
.bulkbar .btn { padding: 6px 12px; }
.bulkbar input { background: var(--panel); color: var(--ink); border: 0; }
.chk { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; }
.chart text { fill: var(--muted); font-size: 11px; font-family: Figtree, sans-serif; }
.chart .grid { stroke: var(--line); }
.legend-row { display: flex; gap: 16px; margin: 0 8px 8px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.legend-row i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.kbar { display: grid; grid-template-columns: 150px 1fr 34px; gap: 10px; align-items: center; padding: 5px 8px; font-size: 13px; }
.kbar .track { height: 8px; background: var(--row); border-radius: 4px; overflow: hidden; }
.kbar .track i { display: block; height: 100%; border-radius: 4px; }
.kbar .k { font-family: var(--mono); font-size: 11px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drop { border: 1.5px dashed var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 6px; cursor: pointer; }
.drop.ok { border-color: var(--ok); background: var(--ok-soft); }
.drop b { font-size: 14px; }
.age { font-variant-numeric: tabular-nums; }
.age.old { color: var(--high); font-weight: 600; }
kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; }
.factors { display: grid; gap: 8px; }
.frow { display: grid; grid-template-columns: 150px 1fr 54px; gap: 10px; align-items: center; font-size: 13px; }
.frow .fbar { height: 10px; background: var(--row); border-radius: 5px; overflow: hidden; position: relative; }
.frow .fbar i { position: absolute; inset: 0 auto 0 0; background: var(--line); }
.frow .fbar b { position: absolute; inset: 0 auto 0 0; background: var(--ok); }
.frow .fd { grid-column: 1 / -1; color: var(--muted); font-size: 12px; margin-top: -4px; }
.stack { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--row); margin: 6px 0 4px; }
.stack i { display: block; height: 100%; }
.approval { background: var(--med-soft); color: var(--ink); border-radius: 10px; padding: 12px 14px; margin: 10px 0; }
.buckets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 0 8px; }
.bucket { border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.bucket .v { font-size: 22px; font-weight: 700; }
.bucket .bars { display: flex; gap: 3px; height: 8px; margin-top: 10px; border-radius: 4px; overflow: hidden; background: var(--row); }
.badge2 { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--low-soft); color: var(--low); white-space: nowrap; }
.badge2.won { background: var(--ok-soft); color: var(--ok); } .badge2.open { background: var(--med-soft); color: var(--med); }
.badge2.expired { background: var(--high-soft); color: var(--high); }
.st.pending_approval { color: var(--accent); } .st.partially_settled { color: var(--med); }
.pill.partially_settled { background: var(--med-soft); color: var(--med); }

/* ================= landing ================= */
#landing { min-height: 100vh; background: var(--canvas); color: var(--ink); }
#landing[hidden], .app[hidden] { display: none !important; }
.l-wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
.l-nav { position: sticky; top: 0; z-index: 30; backdrop-filter: blur(12px); background: color-mix(in srgb, var(--canvas) 82%, transparent); border-bottom: 1px solid var(--line); }
.l-nav .l-wrap { display: flex; align-items: center; gap: 22px; height: 64px; }
.l-nav a.lk { color: var(--ink-2); text-decoration: none; font-weight: 500; font-size: 14px; }
.l-nav a.lk:hover { color: var(--accent); }
.l-hero { padding: 72px 0 44px; display: grid; grid-template-columns: 1.15fr .85fr; gap: 48px; align-items: center; }
.eyebrow { display: inline-flex; gap: 8px; align-items: center; font-size: 13px; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 5px 12px; border-radius: 999px; }
.l-hero h1 { font-size: clamp(36px, 5.2vw, 60px); line-height: 1.04; letter-spacing: -.035em; margin: 18px 0 18px; font-weight: 700; }
.l-hero h1 em { font-style: normal; color: var(--accent); }
.l-hero p.lead { font-size: 18px; line-height: 1.55; color: var(--ink-2); margin: 0 0 28px; max-width: 560px; }
.cta { display: flex; gap: 12px; flex-wrap: wrap; }
.btn.lg { padding: 13px 22px; font-size: 15px; border-radius: 10px; font-weight: 600; }
.l-proof { display: flex; gap: 26px; margin-top: 32px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
.l-proof b { display: block; color: var(--ink); font-size: 22px; font-variant-numeric: tabular-nums; }
.hero-card { background: var(--panel); border-radius: 18px; box-shadow: var(--shadow); padding: 20px; position: relative; overflow: hidden; }
.hero-card .src3 { display: grid; gap: 10px; }
.hc-row { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; padding: 11px 12px; border-radius: 10px; background: var(--row); font-size: 13px; animation: slidein .6s both; }
.hc-row:nth-child(2) { animation-delay: .15s } .hc-row:nth-child(3) { animation-delay: .3s }
.hc-merge { text-align: center; color: var(--muted); font-size: 12px; margin: 10px 0; letter-spacing: .1em; }
.hc-result { border: 1.5px solid var(--accent); border-radius: 12px; padding: 14px; animation: slidein .6s .5s both; }
.hc-result .t { font-weight: 600; margin-bottom: 4px; }
@keyframes slidein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.l-sec { padding: 64px 0; }
.l-sec h2 { font-size: clamp(26px, 3.4vw, 38px); letter-spacing: -.025em; margin: 10px 0 12px; }
.l-sec p.sub { color: var(--ink-2); font-size: 16px; max-width: 680px; margin: 0 0 30px; line-height: 1.55; }
.problem { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.pcard { background: var(--panel); border-radius: 14px; padding: 22px; box-shadow: var(--shadow); }
.pcard .n { font-size: 30px; font-weight: 700; color: var(--accent); }
.pcard h3 { margin: 6px 0; font-size: 16px; }
.pcard p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }

/* flex carousel */
.fc { display: flex; gap: 12px; height: 440px; }
.fc-panel { position: relative; flex: 1; min-width: 0; border-radius: 18px; overflow: hidden; cursor: pointer; color: #fff;
  transition: flex .6s cubic-bezier(.2,.8,.2,1), filter .3s; background: var(--g); outline: none; }
.fc-panel.on { flex: 8.5; cursor: default; }
.fc-panel:not(.on):hover { filter: brightness(1.12); }
.fc-panel:focus-visible { box-shadow: 0 0 0 3px var(--accent); }
.fc-panel .num { position: absolute; top: 18px; left: 18px; font-weight: 700; font-size: 13px; opacity: .8; }
.fc-panel .vt { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%) rotate(180deg); writing-mode: vertical-rl;
  font-weight: 600; font-size: 15px; white-space: nowrap; transition: opacity .3s; }
.fc-panel.on .vt { opacity: 0; }
.fc-body { position: absolute; inset: 0; padding: 30px 32px; display: grid; grid-template-rows: auto 1fr auto; gap: 16px;
  opacity: 0; transform: translateY(14px); transition: opacity .35s, transform .45s; pointer-events: none; min-width: 440px; }
.fc-panel.on .fc-body { opacity: 1; transform: none; transition-delay: .25s; pointer-events: auto; }
.fc-body .ic { width: 46px; height: 46px; border-radius: 12px; background: rgba(255,255,255,.18); display: grid; place-items: center; }
.fc-body .ic svg { width: 24px; height: 24px; stroke: #fff; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.fc-body h3 { font-size: 26px; margin: 14px 0 8px; letter-spacing: -.02em; }
.fc-body p { margin: 0; font-size: 15px; line-height: 1.55; opacity: .92; max-width: 520px; }
.fc-body ul { margin: 14px 0 0; padding: 0; list-style: none; display: grid; gap: 7px; font-size: 14px; }
.fc-body li::before { content: "→ "; opacity: .7; }
.fc-demo { background: rgba(0,0,0,.22); border-radius: 12px; padding: 12px 14px; font-size: 13px; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.fc-demo code { font-family: var(--mono); font-size: 12px; }
.fc-demo a { color: #fff; font-weight: 600; white-space: nowrap; }
.fc-ctrl { display: flex; align-items: center; gap: 14px; margin-top: 18px; }
.fc-dots { display: flex; gap: 6px; flex: 1; }
.fc-dots button { flex: 1; height: 4px; border: 0; border-radius: 2px; background: var(--line); cursor: pointer; padding: 0; position: relative; overflow: hidden; }
.fc-dots button.on::after { content: ""; position: absolute; inset: 0; background: var(--accent); transform-origin: left; animation: fill var(--dur, 6s) linear forwards; }
.fc.paused + .fc-ctrl .fc-dots button.on::after { animation-play-state: paused; }
@keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.fc-arrow { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-size: 18px; }
.fc-count { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; min-width: 52px; text-align: right; }

.flow { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; counter-reset: s; }
.flow div { background: var(--panel); border-radius: 12px; padding: 16px 14px; box-shadow: var(--shadow); position: relative; font-size: 13px; color: var(--muted); }
.flow div b { display: block; color: var(--ink); font-size: 14px; margin: 6px 0 4px; }
.flow div::before { counter-increment: s; content: counter(s, decimal-leading-zero); font-weight: 700; color: var(--accent); font-size: 12px; }
.live { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.live .kpi .v { font-size: 28px; }
.scen { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.scen a { display: block; background: var(--panel); border-radius: 12px; padding: 16px; text-decoration: none; color: var(--ink); box-shadow: var(--shadow); transition: transform .2s; }
.scen a:hover { transform: translateY(-2px); }
.scen .tag { font-family: var(--mono); font-size: 12px; color: var(--accent); }
.scen p { margin: 6px 0 0; color: var(--muted); font-size: 13.5px; line-height: 1.45; }
.stack3 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.term { background: #121316; color: #d8dbe0; border-radius: 14px; padding: 20px 22px; font-family: var(--mono); font-size: 13px; line-height: 1.8; overflow-x: auto; }
.term .c { color: #7b8190; } .term .p { color: #f0652f; }
.l-foot { border-top: 1px solid var(--line); padding: 28px 0 40px; color: var(--muted); font-size: 13px; }
@media (max-width: 960px) {
  .l-hero { grid-template-columns: 1fr; padding-top: 40px; }
  .problem, .scen, .stack3 { grid-template-columns: 1fr; }
  .flow { grid-template-columns: 1fr 1fr; }
  .live { grid-template-columns: 1fr 1fr; }
  .l-nav .lk.hide-sm { display: none; }
  .fc { flex-direction: column; height: auto; }
  .fc-panel { flex: none; height: 64px; transition: height .5s cubic-bezier(.2,.8,.2,1); }
  .fc-panel.on { height: 640px; flex: none; }
  .fc-body { padding-top: 46px !important; }
  .fc-demo { flex-direction: column; align-items: flex-start; }
  .l-nav .btn { white-space: nowrap; padding: 7px 12px; }
  .l-nav .l-wrap { gap: 12px; }
  .fc-panel .vt { writing-mode: horizontal-tb; transform: none; left: 56px; bottom: auto; top: 21px; }
  .fc-body { min-width: 0; padding: 24px 20px; }
  .fc-body h3 { font-size: 22px; }
}

/* CircularCarousel */
.flexc { position: relative; height: 520px; outline: none; cursor: grab; touch-action: pan-y; user-select: none;
  margin: 0 calc(50% - 50vw); width: 100vw; overflow: hidden; }
.flexc.grabbing { cursor: grabbing; }
.flexc:focus-visible { box-shadow: inset 0 0 0 3px var(--accent); }
.flexc-gl { position: absolute; inset: 0; display: block; }
.flexc-cap { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; pointer-events: none; }
.flexc-title { font-weight: 600; font-size: 18px; letter-spacing: -.01em; }
.flexc-count { color: var(--muted); font-size: 13px; margin-top: 4px; font-variant-numeric: tabular-nums; letter-spacing: .08em; }
.flexc-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line);
  background: color-mix(in srgb, var(--panel) 80%, transparent); backdrop-filter: blur(8px); cursor: pointer; font-size: 20px; z-index: 2; opacity: 0; transition: opacity .2s; }
.flexc:hover .flexc-nav, .flexc:focus-within .flexc-nav { opacity: 1; }
.flexc-nav.prev { left: max(16px, calc(50vw - 600px)); } .flexc-nav.next { right: max(16px, calc(50vw - 600px)); }
.flexc-fallback .flexc-row { display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 20px 24px 80px; height: 100%; }
.flexc-fallback .flexc-card { height: 70%; width: auto; border-radius: 18px; scroll-snap-align: center; flex: none; cursor: pointer; }
.fc-dialog { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 16px; background: rgba(10,10,12,.55); backdrop-filter: blur(6px); animation: fadein .25s; }
.fc-dialog .box { width: min(640px, 100%); max-height: calc(100vh - 32px); overflow: auto; border-radius: 20px; color: #fff; background: var(--g); box-shadow: 0 30px 80px rgba(0,0,0,.4); animation: pop .35s cubic-bezier(.2,.9,.3,1.2); }
.fc-dialog .inner { padding: 32px; }
.fc-dialog h3 { font-size: 30px; margin: 16px 0 10px; letter-spacing: -.02em; }
.fc-dialog p { font-size: 16px; line-height: 1.6; opacity: .92; margin: 0; }
.fc-dialog ul { margin: 18px 0; padding: 0; list-style: none; display: grid; gap: 9px; }
.fc-dialog li::before { content: "→ "; opacity: .7; }
.fc-dialog .ic { width: 52px; height: 52px; border-radius: 14px; background: rgba(255,255,255,.18); display: grid; place-items: center; }

/* ================= Magic bento (How it works) ================= */
.bento { --glow: 240, 101, 47; display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: minmax(220px, auto); gap: 12px; position: relative; }
.bento-card { position: relative; border-radius: 20px; background: var(--panel); border: 1px solid var(--line); padding: 20px 22px;
  display: flex; flex-direction: column; overflow: hidden; isolation: isolate; cursor: pointer;
  transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translate(var(--tx, 0px), var(--ty, 0px));
  transition: transform .25s ease-out, border-color .3s; opacity: 0; translate: 0 16px; }
.bento-card.in { opacity: 1; translate: 0 0; transition: transform .25s ease-out, opacity .6s ease, translate .6s cubic-bezier(.2,.8,.2,1); }
.bento-card::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; opacity: var(--spot, 0); transition: opacity .3s;
  background: radial-gradient(var(--sr, 300px) circle at var(--mx, 50%) var(--my, 50%), rgba(var(--glow), .14), transparent 60%); }
.bento-card::after { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; pointer-events: none; opacity: var(--edge, 0);
  background: radial-gradient(var(--sr, 300px) circle at var(--mx, 50%) var(--my, 50%), rgba(var(--glow), .95), rgba(var(--glow), .25) 35%, transparent 60%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
.bento-card .lab { font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: .06em; }
.bento-card h3 { margin: 0; font-size: 17px; letter-spacing: -.01em; }
.bento-card p { margin: 3px 0 0; color: var(--muted); font-size: 13.5px; line-height: 1.45; }
.bento-card .art { flex: 1 0 auto; display: flex; align-items: center; justify-content: center; margin: 10px 0 12px; position: relative; }
.bento-card .txt { margin-top: auto; }
.b-ingest { grid-column: span 1; } .b-norm { grid-column: span 1; } .b-match { grid-column: span 2; grid-row: span 2; }
.b-score { grid-column: span 2; grid-row: span 2; } .b-class { grid-column: span 1; } .b-review { grid-column: span 1; } .b-audit { grid-column: span 4; }
.star { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: rgb(var(--glow)); box-shadow: 0 0 6px rgb(var(--glow)); pointer-events: none; z-index: 2;
  animation: star 1.6s ease-out forwards; }
@keyframes star { from { opacity: 0; transform: translate(0, 0) scale(.6); } 20% { opacity: 1; } to { opacity: 0; transform: translate(var(--dx), -46px) scale(1); } }
.wave { position: absolute; border-radius: 50%; pointer-events: none; z-index: 3; background: radial-gradient(circle, rgba(var(--glow), .35), rgba(var(--glow), 0) 70%);
  transform: translate(-50%, -50%) scale(0); animation: wave .7s ease-out forwards; }
@keyframes wave { to { transform: translate(-50%, -50%) scale(1); opacity: 0; } }
/* artwork */
.a-files { display: grid; gap: 5px; width: 100%; }
.a-file { display: grid; grid-template-columns: 20px 1fr auto; gap: 8px; align-items: center; font-size: 12px; background: var(--row); border-radius: 8px; padding: 5px 8px; row-gap: 4px; }
.a-file .bar { grid-column: 2 / 4; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.a-file .bar i { display: block; height: 100%; width: 0; background: rgb(var(--glow)); animation: fill2 2.2s ease-out forwards; }
@keyframes fill2 { to { width: 100%; } }
.a-norm { width: 100%; display: grid; gap: 6px; font-family: var(--mono); font-size: 12px; }
.a-norm div { display: flex; align-items: center; gap: 8px; background: var(--row); border-radius: 7px; padding: 6px 8px; }
.a-norm span:first-child { color: var(--muted); flex: 1; }
.a-norm b { color: rgb(var(--glow)); animation: pulse 2.4s ease-in-out infinite; }
.a-norm div:nth-child(2) b { animation-delay: .4s } .a-norm div:nth-child(3) b { animation-delay: .8s }
@keyframes pulse { 50% { opacity: .35; } }
.a-match { width: 100%; display: grid; gap: 9px; }
.a-mrow { display: grid; grid-template-columns: 170px 1fr 34px; gap: 10px; align-items: center; font-size: 13px; }
.a-mrow .track { height: 10px; background: var(--row); border-radius: 5px; overflow: hidden; }
.a-mrow .track i { display: block; height: 100%; border-radius: 5px; background: rgb(var(--glow)); transform-origin: left; animation: grow 1.2s cubic-bezier(.2,.8,.2,1) both; }
.a-mrow:nth-child(n+2) .track i { background: rgba(var(--glow), .7); } .a-mrow:nth-child(n+4) .track i { background: rgba(var(--glow), .45); }
@keyframes grow { from { transform: scaleX(0); } }
.a-pair { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 4px; }

.a-pair .ln { flex: 1; height: 2px; background: linear-gradient(90deg, transparent, rgb(var(--glow)), transparent); background-size: 200% 100%; animation: flow 1.8s linear infinite; }
@keyframes flow { from { background-position: 100% 0; } to { background-position: -100% 0; } }
.a-score { width: 100%; display: grid; gap: 10px; }
.a-score .row { display: grid; grid-template-columns: 150px 1fr 40px; gap: 10px; align-items: center; font-size: 13px; }
.a-score .row .t { height: 12px; border-radius: 6px; background: var(--row); position: relative; overflow: hidden; }
.a-score .row .t i { position: absolute; inset: 0 auto 0 0; border-radius: 6px; background: rgb(var(--glow)); animation: grow 1.4s cubic-bezier(.2,.8,.2,1) both; transform-origin: left; }
.a-score .row .t s { position: absolute; inset: 0 auto 0 0; border-radius: 6px; background: var(--line); }
.a-score .total { display: flex; align-items: baseline; gap: 10px; border-top: 1px solid var(--line); padding-top: 10px; }
.a-score .total b { font-size: 34px; letter-spacing: -.02em; }
.a-score .verdict { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--med); background: var(--med-soft); padding: 4px 10px; border-radius: 999px; }
.a-donut { display: flex; align-items: center; gap: 16px; }
.a-donut .legend2 { display: grid; gap: 4px; font-size: 12px; }
.a-donut .legend2 i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.a-donut svg circle { transition: stroke-dasharray 1.2s cubic-bezier(.2,.8,.2,1); }
.a-tog { display: grid; gap: 8px; width: 100%; }
.a-tog div { display: flex; align-items: center; gap: 10px; background: var(--row); border-radius: 10px; padding: 8px 10px; font-size: 13px; font-weight: 500; }
.a-tog .sw { margin-left: auto; width: 34px; height: 20px; border-radius: 10px; background: var(--line); position: relative; transition: background .3s; }
.a-tog .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .3s; }
.a-tog .sw.on { background: rgb(var(--glow)); } .a-tog .sw.on::after { transform: translateX(14px); }
.a-chain { display: flex; align-items: center; gap: 0; width: 100%; overflow: hidden; }
.a-block { flex: 1 1 0; min-width: 0; background: var(--row); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; font-size: 12px; opacity: 0; animation: blk .5s ease forwards; }
.a-block b { display: block; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.a-block code { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.a-block code em { font-style: normal; color: rgb(var(--glow)); }
.a-link { width: 22px; flex: none; height: 2px; background: rgb(var(--glow)); opacity: .6; }
@keyframes blk { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (max-width: 1000px) {
  .bento { grid-template-columns: repeat(2, 1fr); grid-auto-rows: auto; }
  .bento-card { min-height: 200px; }
  .b-match, .b-score, .b-audit { grid-column: span 2; grid-row: auto; }
  .b-audit .a-block:nth-child(n+6) { display: none; }

.timeline { list-style: none; margin: 0; padding: 0 0 0 4px; border-left: 2px solid var(--line); }
.timeline li { padding: 0 0 14px 16px; position: relative; }
.timeline li::before { content: ""; position: absolute; left: -7px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--panel); border: 2px solid var(--accent); }
.timeline .who { font-weight: 600; }
.timeline .when, .timeline .hash { color: var(--muted); font-size: 12px; }
.timeline .hash { font-family: var(--mono); font-size: 10.5px; }

/* traces */
.chain { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 14px 12px; }
.chain:nth-child(odd) { background: var(--row); }
.chain .hd { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.node { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; font-size: 13px; }
.node .t { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 3px; }
.node.none { border-style: dashed; color: var(--muted); background: transparent; }
.node.bad { border-color: var(--high); box-shadow: inset 3px 0 0 var(--high); }
.link { color: var(--accent); cursor: pointer; font-family: var(--mono); font-size: 12px; text-decoration: underline; text-underline-offset: 2px; }
.pill { font-size: 12px; padding: 2px 9px; border-radius: 999px; font-weight: 600; }
.pill.settled { background: var(--ok-soft); color: var(--ok); }
.pill.exception, .pill.missing { background: var(--high-soft); color: var(--high); }
.pill.in_transit, .pill.unmatched { background: var(--med-soft); color: var(--med); }

/* pipeline */
.pipe { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; align-items: start; }
.pipe svg { width: 100%; height: auto; display: block; }
.pipe .box { cursor: pointer; }
.pipe .box:hover rect { stroke: var(--accent); stroke-width: 2; }
.legend dt { font-weight: 600; margin-top: 12px; }
.legend dd { margin: 2px 0 0; color: var(--muted); font-size: 13px; }

/* sources */
.srcgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 18px; }
.srccard { border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
.srccard h3 { margin: 0 0 6px; font-size: 15px; display: flex; gap: 10px; align-items: center; }
.srccard .path { font-family: var(--mono); font-size: 12px; color: var(--muted); word-break: break-all; }
.runform { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; padding: 0 8px; }
.runform label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 500; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--panel); padding: 7px 12px; cursor: pointer; }
.seg button.on { background: var(--ink); color: #fff; }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px;
  border-radius: 10px; z-index: 60; box-shadow: 0 8px 30px rgba(0,0,0,.2); }

@media (max-width: 900px) {
  .app, .app.collapsed { grid-template-columns: 1fr; padding: 10px; gap: 10px; }
  .side { position: static; height: auto; padding: 14px; }
  .logo { padding-bottom: 10px; }
  .nav { flex-direction: row; overflow-x: auto; gap: 4px; }
  .nav a { white-space: nowrap; padding: 8px 12px; }
  .nav .group { border: 0; margin: 0; padding: 0; display: contents; }
  .nav .chev, .side .foot { display: none; }
  .main { padding: 20px 6px 30px; }
  .head { padding: 0 10px; }
  .hide-sm { display: none; }
  input[type=search] { min-width: 0; width: 100%; }
  .chain { grid-template-columns: 1fr 1fr; }
  .pipe { grid-template-columns: 1fr; }
  td { height: auto; padding: 12px 10px; }
}
</style>
</head>
<body>
<div id="landing" hidden></div>
<div class="app" id="app" hidden>
  <aside class="side">
    <div class="logo" onclick="location.hash='#/home'" style="cursor:pointer" title="Back to intro">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="13" cy="13" r="9.5" fill="none" stroke="var(--logo)" stroke-width="3.2"/><path d="M20 20l7 7" stroke="#d64511" stroke-width="3.6" stroke-linecap="round"/><path d="M9 9v8h7" fill="none" stroke="var(--logo)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>LedgerLens</span>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot" style="justify-content:space-between"><button class="collapse" id="theme" title="Toggle dark mode" aria-label="Toggle dark mode"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button><button class="collapse" id="collapse" title="Collapse sidebar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg></button></div>
  </aside>
  <main class="main" id="page"></main>
</div>
<div id="overlay"></div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const amt = (c, ccy = "USD") => (c < 0 ? "−" : "") + (Math.abs(c) / 100).toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " " + (ccy || "USD");
const pct = x => (x * 100).toFixed(1) + "%";
const dayFmt = d => d ? new Date(d + "T00:00:00").toLocaleDateString("en-GB", {day: "numeric", month: "short", year: "numeric"}) : "";
const when = iso => iso ? new Date(iso).toLocaleString("en-GB", {day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"}) : "";
const api = async (p, opt) => { const r = await fetch(p, opt); const j = await r.json(); if (!r.ok) throw new Error(j.error || r.statusText); return j; };
const post = (p, body) => api(p, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), 2800); }

const ICON = {
  reports: '<path d="M8 3h8l4 4v13a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M16 3v4h4"/><path d="M4 7v13a1 1 0 0 0 1 1h1"/>',
  queue: '<path d="M4 6h16M4 12h16M4 18h10"/><circle cx="19" cy="18" r="2"/>',
  trace: '<circle cx="5" cy="12" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="19" cy="18" r="2"/><path d="M7 11l10-4M7 13l10 4"/>',
  payouts: '<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/><path d="M7 15h3"/>',
  pipeline: '<rect x="3" y="3" width="7" height="5" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="8.5" y="16" width="7" height="5" rx="1"/><path d="M6.5 8v3h11V8M12 11v5"/>',
  sources: '<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/>',
  audit: '<path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',
  disputes: '<path d="M12 3v18M5 8h14M5 8l-3 7h6zM19 8l-3 7h6z"/>',
  aging: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/>',
  approvals: '<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>',
};
const svgI = k => `<svg viewBox="0 0 24 24">${ICON[k]}</svg>`;
const CHEV = '<svg class="chev" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M9 6l6 6-6 6"/></svg>';
const SRC_ICON = { "Internal ledger": '<span class="ico ledger">.csv</span>', "Gateway settlement feed": '<span class="ico gateway">G</span>', "Bank settlement": '<span class="ico bank">B</span>' };
const src = name => `<span class="src">${SRC_ICON[name] || ""}${esc(name)}</span>`;

const S = { summary: null, exceptions: [], reports: [], filters: { pairs: [], from: "", to: "" }, qStatus: "active", qSev: "", q: "", tab: "disc", sel: new Set() };

async function refresh() {
  const [summary, exceptions, reports] = await Promise.all([api("/api/summary"), api("/api/exceptions"), api("/api/reports")]);
  Object.assign(S, { summary, exceptions, reports });
  renderNav();
}

function renderNav() {
  const route = location.hash.slice(2).split("/")[0] || "home";
  const active = S.exceptions.filter(e => ["open", "investigating", "pending_approval"].includes(e.status)).length;
  const pending = S.exceptions.filter(e => e.status === "pending_approval").length;
  const openDisputes = (S.summary?.run?.disputes || []).filter(d => d.status !== "won").length;
  const item = (k, label, extra = "") => `<a href="#/${k}" class="${route === k ? "on" : ""}">${svgI(k)}<span class="label">${label}</span>${extra}</a>`;
  $("#nav").innerHTML = item("reports", "Reconciliation") + item("queue", "Exception queue", active ? `<span class="count">${active}</span>` : "")
    + item("approvals", "Approvals", pending ? `<span class="count">${pending}</span>` : "")
    + item("trace", "Follow the money") + item("payouts", "Payouts")
    + item("disputes", "Chargebacks", openDisputes ? `<span class="count">${openDisputes}</span>` : "") + item("aging", "Aging & delays")
    + `<div class="group">${item("pipeline", "Pipeline", CHEV)}${item("sources", "Data sources", CHEV)}${item("audit", "Audit trail", CHEV)}</div>`;
}

const head = (title, sub, right = "") => `<div class="head"><div><h1>${title}</h1><p>${sub}</p></div><div class="grow"></div>${right}</div>`;
const kpis = list => `<section class="kpis">${list.map(([l, v, s]) => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div>${s ? `<div class="s">${s}</div>` : ""}</div>`).join("")}</section>`;
const barCls = x => x >= .9 ? "" : x >= .7 ? "mid" : "lowv";
const pctCell = x => `<span class="pct"><span class="bar ${barCls(x)}"><i style="width:${(x * 100).toFixed(1)}%"></i></span>${pct(x)}</span>`;

/* ---------- Reconciliation reports ---------- */
function filteredReports() {
  const f = S.filters;
  return S.reports.filter(r => (!f.pairs.length || f.pairs.includes(r.pair)) && (!f.from || r.as_of >= f.from) && (!f.to || r.as_of <= f.to));
}

function pageReports() {
  const rows = filteredReports();
  const latestId = rows.length ? Math.max(...rows.map(r => r.run_id)) : null;
  const latest = rows.filter(r => r.run_id === latestId);
  const recon = latest.reduce((t, r) => t + r.reconciled_amount, 0);
  const clean = latest.reduce((t, r) => t + r.clean, 0), recs = latest.reduce((t, r) => t + r.records, 0);
  const diff = latest.reduce((t, r) => t + r.mismatched_amount, 0);
  const ccy = latest[0]?.currency || "USD";
  const f = S.filters;
  const nPairs = f.pairs.length, nDate = (f.from ? 1 : 0) + (f.to ? 1 : 0);
  $("#page").innerHTML = head("Reconciliation", "Review the accuracy by reconciling from multiple sources",
      `<a class="btn" href="#/sources">Run reconciliation</a>`)
    + kpis([["Total reconciled amount", amt(recon, ccy), latestId ? `Run #${latestId} · both source pairs` : "No runs yet"],
            ["Matched percentage", recs ? pct(clean / recs) : "–", recs ? `${clean} of ${recs} records reconcile cleanly` : ""],
            ["Amount difference", amt(diff, ccy), "Money sitting in discrepancies"]])
    + `<div class="grid2">${trendCard()}${kindCard()}</div>`
    + `<div class="card"><h2>Reconciliation reports</h2>
      <div class="tbox">
        <div class="filters" id="filters"><span class="lbl">Filter by</span>
          <button class="fchip" data-pop="source">Source${nPairs ? `<span class="n">${nPairs}</span>` : ""}</button>
          <button class="fchip" data-pop="date">Date${nDate ? `<span class="n">${nDate}</span>` : ""}</button>
          ${nPairs || nDate ? `<button class="fchip ghost" id="clearf">Clear</button>` : ""}
        </div>
        ${rows.length ? `<table><thead><tr><th>Source A</th><th>Source B</th><th>Matched</th><th>Mismatched</th><th class="hide-sm">Issues</th><th>Creation Date</th></tr></thead><tbody>
        ${rows.map(r => `<tr class="click" data-href="#/reports/${r.run_id}/${r.pair}">
          <td>${src(r.source_a)}</td><td>${src(r.source_b)}</td>
          <td class="num">${pct(r.matched_pct)}</td><td class="num">${amt(r.mismatched_amount, r.currency)}</td>
          <td class="hide-sm num">${r.discrepancies}</td>
          <td class="num">${dayFmt(r.as_of)}<div class="kind" style="font-family:inherit">Run #${r.run_id}${r.label ? " · " + esc(r.label) : ""}</div></td></tr>`).join("")}
        </tbody></table>` : `<div class="empty">No reports match. ${S.reports.length ? "Clear the filters." : "Run a reconciliation from Data sources."}</div>`}
      </div></div>`;
  $$("tr[data-href]").forEach(tr => tr.onclick = () => location.hash = tr.dataset.href);
  $("#clearf") && ($("#clearf").onclick = () => { S.filters = { pairs: [], from: "", to: "" }; pageReports(); });
  $$("[data-pop]").forEach(b => b.onclick = e => { e.stopPropagation(); openPop(b); });
}

const SERIES = { ledger_gateway: ["Ledger ↔ Gateway", "#d64511"], gateway_bank: ["Gateway ↔ Bank", "#3b6fd8"] };
function trendCard() {
  const runs = [...new Set(S.reports.map(r => r.run_id))].sort((a, b) => a - b);
  if (runs.length < 2) return `<div class="card"><h2>Match rate over time</h2><div class="empty">Trends appear after two or more runs.</div></div>`;
  const W = 560, H = 210, L = 40, R = 14, T = 12, B = 34;
  const x = i => L + (W - L - R) * (runs.length === 1 ? .5 : i / (runs.length - 1));
  const y = v => T + (H - T - B) * (1 - v);
  const grid = [0, .25, .5, .75, 1].map(v => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v * 100}%</text>`).join("");
  const xl = runs.map((id, i) => { const r = S.reports.find(q => q.run_id === id); return `<text x="${x(i)}" y="${H - 12}" text-anchor="middle">#${id} · ${dayFmt(r.as_of).slice(0, 6)}</text>`; }).join("");
  const lines = Object.entries(SERIES).map(([pair, [label, color]]) => {
    const pts = runs.map((id, i) => { const r = S.reports.find(q => q.run_id === id && q.pair === pair); return r ? [x(i), y(r.matched_pct), r] : null; }).filter(Boolean);
    return `<polyline fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round" points="${pts.map(p => p[0] + "," + p[1]).join(" ")}"/>`
      + pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--panel)" stroke="${color}" stroke-width="2.4"><title>${label} · run #${p[2].run_id}: ${pct(p[2].matched_pct)} clean, ${amt(p[2].mismatched_amount, p[2].currency)} mismatched</title></circle>`).join("");
  }).join("");
  return `<div class="card"><h2>Match rate over time <span class="sub">share of records reconciling cleanly, per run</span></h2>
    <div class="legend-row">${Object.values(SERIES).map(([l, c]) => `<span><i style="background:${c}"></i>${l}</span>`).join("")}</div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Match rate trend">${grid}${xl}${lines}</svg></div>`;
}
const KIND_COLOR = { high: "var(--high)", medium: "var(--med)", low: "var(--low)" };
function kindCard() {
  const active = S.exceptions.filter(e => ["open", "investigating"].includes(e.status));
  const by = {};
  active.forEach(e => { by[e.kind] = by[e.kind] || { n: 0, sev: e.severity }; by[e.kind].n++; });
  const rows = Object.entries(by).sort((a, b) => b[1].n - a[1].n);
  const max = Math.max(1, ...rows.map(r => r[1].n));
  return `<div class="card"><h2>Open exceptions by type <span class="sub">${active.length} total</span></h2>
    ${rows.length ? rows.map(([k, v]) => `<div class="kbar" title="${esc(k)}"><span class="k">${esc(k.replace(/_/g, " ").toLowerCase())}</span>
      <span class="track"><i style="width:${v.n / max * 100}%;background:${KIND_COLOR[v.sev]}"></i></span><b class="num">${v.n}</b></div>`).join("")
      : `<div class="empty">Nothing open. Inbox zero.</div>`}
    <div style="padding:10px 8px 0"><a class="btn" href="#/queue">Open exception queue →</a></div></div>`;
}

function openPop(btn) {
  $$(".pop").forEach(p => p.remove());
  const box = $("#filters"), f = S.filters, pop = document.createElement("div");
  pop.className = "pop";
  pop.style.left = (btn.offsetLeft) + "px";
  if (btn.dataset.pop === "source") {
    pop.innerHTML = [["ledger_gateway", "Internal ledger ↔ Gateway feed"], ["gateway_bank", "Gateway feed ↔ Bank settlement"]]
      .map(([k, l]) => `<label><input type="checkbox" value="${k}" ${f.pairs.includes(k) ? "checked" : ""}> ${l}</label>`).join("")
      + `<div class="actions"><button class="btn" data-x>Cancel</button><button class="btn primary" data-ok>Apply</button></div>`;
  } else {
    pop.innerHTML = `<div class="row"><span class="muted" style="width:40px">From</span><input type="date" id="dfrom" value="${f.from}"></div>
      <div class="row"><span class="muted" style="width:40px">To</span><input type="date" id="dto" value="${f.to}"></div>
      <div class="actions"><button class="btn" data-x>Cancel</button><button class="btn primary" data-ok>Apply</button></div>`;
  }
  box.append(pop);
  pop.onclick = e => e.stopPropagation();
  $("[data-x]", pop).onclick = () => pop.remove();
  $("[data-ok]", pop).onclick = () => {
    if (btn.dataset.pop === "source") f.pairs = $$("input:checked", pop).map(i => i.value);
    else { f.from = $("#dfrom").value; f.to = $("#dto").value; }
    pageReports();
  };
}
document.addEventListener("click", () => $$(".pop").forEach(p => p.remove()));

async function pageReport(runId, pair) {
  const r = await api(`/api/reports/${runId}/${pair}`);
  const tab = S.tab;
  $("#page").innerHTML = `<div class="head"><div><a class="crumb" href="#/reports">‹ Reconciliation reports</a>
      <h1 style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">${src(r.source_a)} <span class="muted">↔</span> ${src(r.source_b)}</h1>
      <p>Run #${r.run.id}${r.run.label ? " · " + esc(r.run.label) : ""} · as of ${dayFmt(r.run.as_of)}</p></div>
      <div class="grow"></div><a class="btn" href="/api/export/report/${r.run.id}/${pair}.csv" download>⤓ Export CSV</a></div>`
    + kpis([["Reconciled amount", amt(r.reconciled_amount, r.currency)], ["Matched percentage", pct(r.matched_pct), `${r.clean} of ${r.records} records clean`],
            ["Amount difference", amt(r.mismatched_amount, r.currency), `${r.discrepancies.length} discrepancies`]])
    + (r.breakdown?.length ? `<div class="card"><h2>By source <span class="sub">every gateway and bank account in this run</span></h2><div class="tbox"><table><thead><tr><th>Source</th><th>Type</th><th>Records</th><th>Matched</th><th class="r">Mismatched</th></tr></thead><tbody>
        ${r.breakdown.map(b => `<tr><td><b>${esc(b.source)}</b></td><td><span class="badge2">${b.type}</span></td><td class="num">${b.clean} / ${b.records}</td><td>${pctCell(b.matched_pct)}</td><td class="r num">${amt(b.mismatched_amount, r.currency)}</td></tr>`).join("")}
      </tbody></table></div></div>` : "")
    + `<div class="card"><div class="tabs2"><button data-t="disc" class="${tab === "disc" ? "on" : ""}">Discrepancies (${r.discrepancies.length})</button>
         <button data-t="match" class="${tab === "match" ? "on" : ""}">Matched records (${r.matches.length})</button></div>
       <div class="tbox">${tab === "disc" ? discTable(r.discrepancies) : matchTable(r.matches)}</div></div>`;
  $$("[data-t]").forEach(b => b.onclick = () => { S.tab = b.dataset.t; pageReport(runId, pair); });
  bindRows();
}

function discTable(list, selectable = false) {
  if (!list.length) return `<div class="empty">No discrepancies. Everything reconciled.</div>`;
  const all = selectable && list.every(e => S.sel.has(e.fingerprint));
  return `<table><thead><tr>${selectable ? `<th style="width:36px"><input type="checkbox" class="chk" id="selall" aria-label="Select all" ${all ? "checked" : ""}></th>` : ""}<th>Severity</th><th>Issue</th><th class="r">Impact</th>${selectable ? `<th class="hide-sm r">Age</th>` : ""}<th class="hide-sm">Status</th></tr></thead><tbody>
    ${list.map(e => `<tr class="click ${selectable && S.sel.has(e.fingerprint) ? "sel" : ""}" data-fp="${esc(e.fingerprint)}">${selectable ? `<td><input type="checkbox" class="chk" data-sel="${esc(e.fingerprint)}" aria-label="Select" ${S.sel.has(e.fingerprint) ? "checked" : ""}></td>` : ""}<td><span class="sev ${e.severity}">${e.severity}</span></td>
      <td><div>${esc(e.summary)}</div><div class="kind">${esc(e.kind)}${e.assignee ? " · @" + esc(e.assignee) : ""}${e.candidates?.length && ["open","investigating"].includes(e.status) ? ` · <span style="color:var(--accent)">${e.candidates.length} candidate${e.candidates.length > 1 ? "s" : ""} to review</span>` : ""}</div></td>
      <td class="r num">${e.amount_delta ? amt(e.amount_delta, e.currency || "USD") : "–"}</td>
      ${selectable ? `<td class="hide-sm r age ${e.age_days >= 3 && ["open", "investigating"].includes(e.status) ? "old" : ""}" title="Days since first detected">${e.age_days}d</td>` : ""}
      <td class="hide-sm"><span class="st ${e.status}">${e.status.replace("_", " ")}</span></td></tr>`).join("")}</tbody></table>`;
}

function factorsHtml(fs, total) {
  if (!fs?.length) return "";
  return `<div class="factors">${fs.map(f => `<div class="frow"><span>${esc(f.factor)} <span class="muted">×${f.weight}</span></span>
      <span class="fbar" title="weight ${f.weight} · score ${f.score}"><i style="width:${f.weight * 100}%"></i><b style="width:${f.contribution * 100}%"></b></span>
      <b class="num r">+${Math.round(f.contribution * 100)}</b><span class="fd">${esc(f.detail)}</span></div>`).join("")}
    <div class="frow" style="border-top:1px solid var(--line);padding-top:8px"><b>Confidence</b><span></span><b class="num r">${Math.round(total * 100)}%</b></div></div>`;
}
function openMatch(m) {
  $("#overlay").innerHTML = `<div class="scrim"></div><aside class="drawer" role="dialog" aria-label="Match explanation">
    <button class="x" aria-label="Close">×</button><span class="method ${m.method.split(" ")[0]}">${esc(m.method)}</span>
    <h2>${m.left_ids.map(esc).join(" + ")} ↔ ${m.right_ids.map(esc).join(" + ")}</h2>
    <p>${m.left_ids.length > 1 || m.right_ids.length > 1 ? `<b>${m.left_ids.length}:${m.right_ids.length} match.</b> ` : ""}${esc(m.explanation)}</p>
    <h3>Why this confidence · ${Math.round(m.confidence * 100)}%</h3>
    <p class="muted" style="font-size:13px">Each factor's weight (grey) times its score gives its contribution (green). The contributions add up to the confidence.</p>
    ${factorsHtml(m.factors, m.confidence)}</aside>`;
  const close = () => { $("#overlay").innerHTML = ""; };
  $(".scrim").onclick = close; $(".x").onclick = close;
}
function matchTable(list) {
  if (!list.length) return `<div class="empty">No matches in this run.</div>`;
  S.matchList = list;
  return `<table><thead><tr><th>Source A</th><th>Source B</th><th>Method</th><th>Confidence</th><th class="hide-sm">Why</th></tr></thead><tbody>
    ${list.map((m, i) => `<tr class="click" data-mi="${i}"><td class="mono">${m.left_ids.map(esc).join(", ")}</td><td class="mono">${m.right_ids.map(esc).join(", ")}</td>
      <td><span class="method ${m.method.split(" ")[0]}">${esc(m.method)}</span></td><td>${pctCell(m.confidence)}</td>
      <td class="hide-sm muted" style="font-size:13px">${esc(m.explanation)}</td></tr>`).join("")}</tbody></table>`;
}

function bindMatches() { $$("tr[data-mi]").forEach(r => r.onclick = () => openMatch(S.matchList[+r.dataset.mi])); }
function bindRows() { bindMatches(); $$("tr[data-fp]").forEach(r => r.onclick = e => { if (e.target.closest(".chk")) return; openDrawer(r.dataset.fp); }); }

/* ---------- Exception queue ---------- */
function pageQueue() {
  const isActive = e => ["open", "investigating", "pending_approval"].includes(e.status);
  const active = S.exceptions.filter(isActive);
  const money = active.filter(e => !["DUPLICATE_WEBHOOK", "DELAYED_SETTLEMENT", "REFERENCE_MISMATCH"].includes(e.kind)).reduce((t, e) => t + Math.abs(e.amount_delta), 0);
  const cands = active.filter(e => e.candidates?.length).length;
  const STAT = [["active", "Active"], ["open", "Open"], ["investigating", "Investigating"], ["pending_approval", "Awaiting approval"], ["resolved", "Resolved"], ["accepted", "Accepted"], ["auto_cleared", "Auto-cleared"], ["", "All"]];
  const match = (e, st) => st === "" || (st === "active" ? isActive(e) : e.status === st);
  const rows = S.exceptions.filter(e => match(e, S.qStatus) && (!S.qSev || e.severity === S.qSev)
    && (!S.q || (e.summary + e.fingerprint + JSON.stringify(e.refs)).toLowerCase().includes(S.q.toLowerCase())));
  $("#page").innerHTML = head("Exception queue", "Classified discrepancies awaiting human review and resolution")
    + kpis([["Awaiting review", active.length, `${active.filter(e => e.severity === "high").length} high severity`],
            ["Candidate matches", cands, "Probabilistic suggestions to confirm"],
            ["Money at issue", amt(money), "Across active exceptions"]])
    + `<div class="card"><div class="filters" style="padding:0 8px 14px">
        ${STAT.map(([k, l]) => `<button class="chip ${S.qStatus === k ? "on" : ""}" data-st="${k}">${l}<span class="n">${S.exceptions.filter(e => match(e, k)).length}</span></button>`).join("")}
        <span style="width:8px"></span>
        ${["high", "medium", "low"].map(s => `<button class="chip ${S.qSev === s ? "on" : ""}" data-sv="${s}">${s}</button>`).join("")}
        <span style="flex:1"></span><input type="search" id="q" placeholder="Search…  ( / )" value="${esc(S.q)}">
        <a class="btn" href="/api/export/exceptions.csv${S.qStatus ? "?status=" + S.qStatus : ""}" download>⤓ Export CSV</a></div>
      ${S.sel.size ? `<div class="bulkbar"><b>${S.sel.size} selected</b><span style="flex:1"></span>
        <input type="text" id="bactor" placeholder="Your name" value="${esc(lsGet("ll_actor") || "")}" style="width:130px">
        <input type="text" id="bnote" placeholder="Note for the audit trail" style="min-width:220px">
        <button class="btn" data-bulk="investigate">Investigate</button><button class="btn" data-bulk="assign">Assign to me</button>
        <button class="btn" data-bulk="accept">Accept</button><button class="btn primary" data-bulk="resolve">Resolve</button>
        <button class="btn" id="bclear">Clear</button></div>` : ""}
      <div class="tbox">${discTable(rows, true)}</div></div>`;
  $$("[data-st]").forEach(b => b.onclick = () => { S.qStatus = b.dataset.st; pageQueue(); });
  $$("[data-sv]").forEach(b => b.onclick = () => { S.qSev = S.qSev === b.dataset.sv ? "" : b.dataset.sv; pageQueue(); });
  const q = $("#q"); q.oninput = () => { S.q = q.value; const p = q.selectionStart; pageQueue(); const n = $("#q"); n.focus(); n.setSelectionRange(p, p); };
  $$("[data-sel]").forEach(c => c.onchange = () => { c.checked ? S.sel.add(c.dataset.sel) : S.sel.delete(c.dataset.sel); pageQueue(); });
  $("#selall") && ($("#selall").onchange = e => { rows.forEach(r => e.target.checked ? S.sel.add(r.fingerprint) : S.sel.delete(r.fingerprint)); pageQueue(); });
  $("#bclear") && ($("#bclear").onclick = () => { S.sel.clear(); pageQueue(); });
  $$("[data-bulk]").forEach(b => b.onclick = async () => {
    const actor = $("#bactor").value.trim();
    if (!actor) { toast("Add your name for the audit trail"); $("#bactor").focus(); return; }
    lsSet("ll_actor", actor);
    const action = b.dataset.bulk, note = action === "assign" ? actor : $("#bnote").value.trim();
    if (["resolve", "accept"].includes(action) && !note) { toast("Add a note before resolving or accepting"); $("#bnote").focus(); return; }
    const r = await post("/api/exceptions/bulk", { fingerprints: [...S.sel], action, actor, note });
    S.sel.clear(); await refresh(); pageQueue();
    toast(`${r.done.length} updated` + (Object.keys(r.failed).length ? ` · ${Object.keys(r.failed).length} skipped (not allowed from their status)` : ""));
  });
  bindRows();
}

/* ---------- Drawer: human review ---------- */
const ACTIONS = {
  investigate: { from: ["open"], label: "Investigate" },
  resolve: { from: ["open", "investigating"], label: "Resolve", primary: true },
  approve: { from: ["pending_approval"], label: "Approve", primary: true },
  reject: { from: ["pending_approval"], label: "Reject" },
  accept: { from: ["open", "investigating"], label: "Accept as-is" },
  reopen: { from: ["resolved", "accepted", "auto_cleared"], label: "Reopen" },
  assign: { label: "Assign" }, comment: { label: "Comment" },
};
async function openDrawer(fp) {
  const e = await api("/api/exceptions/" + encodeURIComponent(fp));
  const open = ["open", "investigating"].includes(e.status);
  $("#overlay").innerHTML = `<div class="scrim"></div><aside class="drawer" role="dialog" aria-label="Exception detail">
    <button class="x" aria-label="Close">×</button>
    <span class="sev ${e.severity}">${e.severity}</span> <span class="kind" style="display:inline">${esc(e.kind)}</span>
    <h2>${esc(e.summary)}</h2>
    <p><span class="st ${e.status}">${e.status.replace("_", " ")}</span>${e.assignee ? ` · assigned to <b>${esc(e.assignee)}</b>` : ""}${e.amount_delta ? ` · impact <b>${amt(e.amount_delta, e.currency)}</b>` : ""}</p>
    ${e.status === "pending_approval" ? `<div class="approval"><b>Awaiting approval.</b> ${esc(e.requested_by)} asked to <b>${esc(e.pending_action)}</b> this exception. High-severity items and items of $100 or more need a second reviewer (maker-checker), so ${esc(e.requested_by)} can't approve their own request.</div>` : ""}
    ${["open", "investigating"].includes(e.status) && (e.severity === "high" || Math.abs(e.amount_delta) >= 10000) ? `<p class="muted" style="font-size:12.5px">ⓘ Resolving or accepting this needs approval from a second reviewer.</p>` : ""}
    <h3>Why this was flagged</h3><p>${esc(e.explanation)}</p>
    <h3>Suggested action</h3><p class="suggest">${esc(e.suggested_action)}</p>
    ${e.candidates.length ? `<h3>Candidate matches · probabilistic</h3>${e.candidates.map(c => `
      <div class="cand"><div><div class="mono">${esc(c.id)}</div><div>${esc(c.label)}</div></div>
        <div style="text-align:right"><div class="score">${Math.round(c.score * 100)}%</div>${open ? `<button class="btn dark" data-link="${esc(c.id)}">Confirm match</button>` : ""}</div>
        <div class="why" style="grid-column:1/-1">${factorsHtml(c.factors, c.score) || c.reasons.map(esc).join(" · ")}</div></div>`).join("")}` : ""}
    <h3>Records involved</h3>
    <div class="refs">${Object.entries(e.refs).flatMap(([k, ids]) => ids.map(i => `<span class="ref"><b>${esc(k)}</b> ${esc(i)}</span>`)).join("")}</div>
    <h3>Review</h3>
    <div class="form">
      <input type="text" id="actor" placeholder="Your name" value="${esc(lsGet("ll_actor") || "")}">
      <textarea id="note" placeholder="Note: what you found or did. Required to resolve, accept, reopen, comment or assign."></textarea>
      <div class="acts">${Object.entries(ACTIONS).filter(([, a]) => !a.from || a.from.includes(e.status)).map(([k, a]) => `<button class="btn ${a.primary ? "primary" : ""}" data-act="${k}">${a.label}</button>`).join("")}</div>
      <div class="err" id="err"></div>
    </div>
    <h3>Audit trail</h3>
    <ul class="timeline">${e.events.slice().reverse().map(ev => `<li>
      <div><span class="who">${esc(ev.actor)}</span> ${esc(ev.action.replace("_", " "))} ${ev.from_status !== ev.to_status ? `<span class="muted">${esc(ev.from_status || "∅")} → ${esc(ev.to_status)}</span>` : ""}</div>
      ${ev.note ? `<div>${esc(ev.note)}</div>` : ""}
      <div class="when">${when(ev.ts)}${ev.run_id ? ` · run #${ev.run_id}` : ""}</div><div class="hash" title="SHA-256, chained to the previous event">#${esc(ev.hash.slice(0, 16))}</div></li>`).join("")}</ul>
  </aside>`;
  const close = () => { $("#overlay").innerHTML = ""; };
  $(".scrim").onclick = close; $(".x").onclick = close;
  document.onkeydown = k => { if (k.key === "Escape") close(); };
  const send = async (action, candidate = "") => {
    const actor = $("#actor").value.trim(), note = $("#note").value.trim();
    lsSet("ll_actor", actor);
    try {
      await post(`/api/exceptions/${encodeURIComponent(fp)}/actions`, { action, actor, note: action === "assign" && !note ? actor : note, candidate });
      await refresh(); route(); openDrawer(fp);
      toast(action === "link" ? "Match confirmed. It will be used in the next run." : "Saved to audit trail");
    } catch (err) { $("#err").textContent = err.message; }
  };
  $$("[data-act]").forEach(b => b.onclick = () => send(b.dataset.act));
  $$("[data-link]").forEach(b => b.onclick = () => send("link", b.dataset.link));
}

/* ---------- Follow the money ---------- */
async function pageTrace() {
  const traces = await api("/api/traces");
  const draw = () => {
    const q = S.q.toLowerCase();
    const list = traces.filter(t => !q || JSON.stringify(t).toLowerCase().includes(q));
    const node = (t, inner, cls = "") => `<div class="node ${cls}"><div class="t">${t}</div>${inner}</div>`;
    const sep = "<hr style='border:0;border-top:1px dashed var(--line);margin:6px 0'>";
    $("#chains").innerHTML = list.map(t => {
      const bad = new Set(t.discrepancies.map(f => f.split(":")[0]));
      return `<div class="chain"><div class="hd"><b>${esc(t.ref)}</b><span class="pill ${t.status}">${t.status.replace("_", " ")}</span>${t.lifecycle ? `<span class="badge2">${t.lifecycle}</span>` : ""}${t.disputed ? `<span class="badge2 open">disputed</span>` : ""}
          ${t.discrepancies.map(f => `<span class="link" data-fp="${esc(f)}">${esc(f.split(":")[0])}</span>`).join(" ")}</div>
        ${t.ledger.length ? node("Internal ledger", t.ledger.map(l => `<div class="mono">${esc(l.id)}</div>${l.kind} ${amt(l.amount, l.currency)}`).join(sep), ["DUPLICATE_LEDGER_ENTRY", "AMOUNT_MISMATCH"].some(k => bad.has(k)) ? "bad" : "") : node("Internal ledger", "No entry", "none bad")}
        ${t.gateway.length ? node("Gateway", t.gateway.map(g => `<div class="mono">${esc(g.id)}${g.copies > 1 ? ` ×${g.copies}` : ""}</div>${esc(g.gateway)} · ${g.kind.replace("_", " ")} ${amt(g.gross, g.currency)}`).join(sep), ["DUPLICATE_CHARGE", "FEE_VARIANCE", "UNRECORDED_REFUND"].some(k => bad.has(k)) ? "bad" : "") : node("Gateway", "Not captured", "none bad")}
        ${t.payouts.length ? node("Payout", t.payouts.map(p => `<div class="mono">${esc(p.id)}</div>due ${dayFmt(p.expected_date)} · <span class="st ${p.status}">${p.status.replace("_", " ")}</span>`).join(sep), t.payouts.some(p => p.status === "missing") ? "bad" : "") : node("Payout", "–", "none")}
        ${t.payouts.some(p => p.bank_id) ? node("Bank", t.payouts.filter(p => p.bank_id).map(p => `<div class="mono">${esc(p.bank_id)}</div>${esc(p.bank_account || "")} · received ${dayFmt(p.bank_date)}`).join(sep), ["PAYOUT_AMOUNT_MISMATCH", "DELAYED_SETTLEMENT"].some(k => bad.has(k)) ? "bad" : "") : node("Bank", "Not received", "none")}
      </div>`; }).join("") || `<div class="empty">No matching orders.</div>`;
    $$("#chains [data-fp]").forEach(el => el.onclick = () => openDrawer(el.dataset.fp));
  };
  $("#page").innerHTML = head("Follow the money", "Every order traced from ledger to gateway to payout to bank")
    + `<div class="card"><div class="filters" style="padding:0 8px 14px"><input type="search" id="q" placeholder="Order ref, txn id, payout or bank ref…" value="${esc(S.q)}">
        <span class="muted">${traces.length} orders · ${traces.filter(t => t.status !== "exception").length} fully reconciled</span></div>
      <div class="tbox" id="chains"></div></div>`;
  $("#q").oninput = e => { S.q = e.target.value; draw(); };
  draw();
}

/* ---------- Approvals ---------- */
function pageApprovals() {
  const rows = S.exceptions.filter(e => e.status === "pending_approval");
  $("#page").innerHTML = head("Approvals", "Maker-checker: high-severity or $100+ closures need a second reviewer")
    + kpis([["Awaiting approval", rows.length, "Requested by one reviewer"],
            ["Money behind them", amt(rows.reduce((t, e) => t + Math.abs(e.amount_delta), 0)), "Absolute impact"],
            ["Your name", esc(lsGet("ll_actor") || "not set"), "You can't approve your own requests"]])
    + `<div class="card"><div class="tbox">${rows.length ? `<table><thead><tr><th>Severity</th><th>Exception</th><th>Request</th><th>Requested by</th><th class="r">Impact</th></tr></thead><tbody>
      ${rows.map(e => `<tr class="click" data-fp="${esc(e.fingerprint)}"><td><span class="sev ${e.severity}">${e.severity}</span></td><td>${esc(e.summary)}<div class="kind">${esc(e.kind)}</div></td>
        <td><b>${esc(e.pending_action)}</b></td><td>${esc(e.requested_by)}</td><td class="r num">${amt(e.amount_delta, e.currency)}</td></tr>`).join("")}</tbody></table>`
      : `<div class="empty">Nothing waiting. When someone resolves a high-severity or $100+ exception, it lands here for a second reviewer.</div>`}</div></div>`;
  bindRows();
}

/* ---------- Chargebacks ---------- */
function pageDisputes() {
  const ds = S.summary.run?.disputes || [];
  const open = ds.filter(d => d.status === "open"), won = ds.filter(d => d.status === "won");
  const sum = l => l.reduce((t, d) => t + d.amount, 0);
  $("#page").innerHTML = head("Chargebacks & reversals", "Every dispute across gateways, with its evidence deadline")
    + kpis([["Open disputes", open.length, `${amt(sum(open))} at risk`],
            ["Won (reversed)", won.length, `${amt(sum(won))} recovered`],
            ["Win rate", ds.length ? pct(won.length / ds.length) : "–", `${ds.length} disputes in total`]])
    + `<div class="card"><div class="tbox">${ds.length ? `<table><thead><tr><th>Chargeback</th><th>Order</th><th>Gateway</th><th class="r">Amount</th><th>Opened</th><th>Deadline</th><th>Status</th><th class="hide-sm">In ledger</th></tr></thead><tbody>
      ${ds.sort((a, b) => a.days_left - b.days_left).map(d => `<tr class="click" data-fp="${d.status === "won" ? "" : "CHARGEBACK_OPEN:" + esc(d.id)}">
        <td class="mono">${esc(d.id)}${d.reversal_id ? `<div class="kind">↩ ${esc(d.reversal_id)}</div>` : ""}</td><td>${esc(d.ref)}</td><td>${esc(d.gateway)}</td>
        <td class="r num">${amt(d.amount, d.currency)}<div class="kind" style="font-family:inherit">+ ${amt(d.fee, d.currency)} fee</div></td>
        <td class="num">${dayFmt(d.opened)}</td>
        <td class="num">${dayFmt(d.deadline)}${d.status === "open" ? `<div class="kind" style="font-family:inherit;color:${d.days_left <= 2 ? "var(--high)" : "inherit"}">${d.days_left} day${d.days_left === 1 ? "" : "s"} left</div>` : ""}</td>
        <td><span class="badge2 ${d.status}">${d.status}</span></td><td class="hide-sm">${d.recorded_in_ledger ? "✓" : `<span style="color:var(--high)">missing</span>`}</td></tr>`).join("")}</tbody></table>`
      : `<div class="empty">No chargebacks in this run.</div>`}</div></div>`;
  $$("tr[data-fp]").forEach(r => r.onclick = () => r.dataset.fp && openDrawer(r.dataset.fp));
}

/* ---------- Aging & settlement delay ---------- */
function pageAging() {
  const active = S.exceptions.filter(e => ["open", "investigating", "pending_approval"].includes(e.status));
  const B = [["0–1 days", 0, 1], ["2–3 days", 2, 3], ["4–7 days", 4, 7], ["8+ days", 8, 1e9]];
  const sevC = { high: "var(--high)", medium: "var(--med)", low: "var(--low)" };
  const st = S.summary.run?.stats?.settlement || { by_gateway: [], by_account: [] };
  const ps = S.summary.run?.payouts || [];
  const maxDelay = Math.max(1, ...ps.map(p => Math.abs(p.delay_days || 0)));
  $("#page").innerHTML = head("Aging & settlement delays", "How long problems stay open and how late money arrives")
    + `<div class="card"><h2>Exception aging <span class="sub">${active.length} active, by days since first detected</span></h2><div class="buckets">
      ${B.map(([l, lo, hi]) => { const r = active.filter(e => e.age_days >= lo && e.age_days <= hi);
        return `<div class="bucket"><div class="muted">${l}</div><div class="v">${r.length}</div><div class="muted" style="font-size:12px">${amt(r.reduce((t, e) => t + Math.abs(e.amount_delta), 0))}</div>
          <div class="bars">${["high", "medium", "low"].map(s => { const n = r.filter(e => e.severity === s).length; return n ? `<i style="flex:${n};background:${sevC[s]}" title="${n} ${s}"></i>` : ""; }).join("")}</div></div>`; }).join("")}
    </div></div>
    <div class="card"><h2>Settlement performance by gateway</h2><div class="tbox"><table><thead><tr><th>Gateway</th><th>Payouts</th><th>On time</th><th>Avg delay</th><th>Worst</th><th>Partial</th><th>Missing</th><th class="r">Outstanding</th></tr></thead><tbody>
      ${st.by_gateway.map(g => `<tr><td><b>${esc(g.gateway)}</b></td><td class="num">${g.settled} / ${g.payouts} settled</td><td>${g.settled ? pctCell(g.on_time / g.settled) : "–"}</td>
        <td class="num">${g.avg_delay == null ? "–" : (g.avg_delay > 0 ? "+" : "") + g.avg_delay + "d"}</td><td class="num">${g.max_delay == null ? "–" : g.max_delay + "d"}</td>
        <td class="num">${g.partial}</td><td class="num" style="color:${g.missing ? "var(--high)" : "inherit"}">${g.missing}</td><td class="r num">${amt(g.outstanding)}</td></tr>`).join("")}
    </tbody></table></div></div>
    <div class="card"><h2>Payout timeline <span class="sub">days late (+) or early (−) versus T+2; overdue for unsettled</span></h2><div class="tbox"><table><tbody>
      ${ps.slice().sort((a, b) => (b.delay_days ?? -99) - (a.delay_days ?? -99)).map(p => { const d = p.delay_days ?? 0;

/* ================= Hero: follow the sun ================= */
function mountSunrise() {
  const root = $("#sun"); if (!root) return () => {};
  const cv = $(".sun-canvas", root), ctx = cv.getContext("2d"), cols = $$(".sun-col", root);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W = 0, H = 0, raf = 0, dead = false, active = 1, hoverIdx = null, sunX = null, lastSwitch = performance.now();
  const STEP = 3400;
  const stars = Array.from({ length: 170 }, () => ({ x: Math.random(), y: Math.random() * 0.78, r: Math.random() * 1.1 + 0.2, p: Math.random() * 6.28, s: 0.6 + Math.random() * 1.6 }));
  const size = () => { const r = root.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2); W = r.width; H = r.height; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); };
  const ro = new ResizeObserver(size); ro.observe(root); size();
  const setActive = i => { active = i; cols.forEach((c, k) => c.classList.toggle("on", k === i)); };
  setActive(active);
  const colX = i => { const a = root.getBoundingClientRect(), r = cols[i].getBoundingClientRect(); return r.left - a.left + r.width / 2; };
  cols.forEach((c, i) => {
    c.addEventListener("mouseenter", () => { hoverIdx = i; setActive(i); });
    c.addEventListener("mouseleave", () => { hoverIdx = null; lastSwitch = performance.now(); });
    c.addEventListener("focus", () => { hoverIdx = i; setActive(i); });
    c.addEventListener("blur", () => { hoverIdx = null; });
    c.addEventListener("click", () => { setActive(i); lastSwitch = performance.now(); });
  });
  let last = 0;
  function draw(now) {
    if (dead) return;
    const dt = Math.min(0.25, (now - (last || now)) / 1000); last = now;
    if (!reduce && hoverIdx == null && now - lastSwitch > STEP) { setActive((active + 1) % cols.length); lastSwitch = now; }
    const target = colX(active);
    sunX = sunX == null ? target : sunX + (target - sunX) * (1 - Math.exp(-dt * 2.4));
    ctx.clearRect(0, 0, W, H);
    // planet geometry: a huge circle whose top edge forms the horizon
    const R = Math.max(W * 1.9, 1600), horizon = H - Math.min(170, H * 0.24), cx = W / 2, cy = horizon + R;
    const rimY = x => cy - Math.sqrt(Math.max(R * R - (x - cx) * (x - cx), 0));
    const sy = rimY(sunX);
    // stars (dimmer near the dawn)
    for (const st of stars) {
      const x = st.x * W, y = st.y * horizon, near = Math.max(0, 1 - Math.hypot(x - sunX, y - sy) / (W * 0.45));
      const tw = reduce ? 0.7 : 0.55 + 0.45 * Math.sin(now / 1000 * st.s + st.p);
      ctx.fillStyle = `rgba(255,255,255,${(0.55 * tw * (1 - near)).toFixed(3)})`;
      ctx.beginPath(); ctx.arc(x, y, st.r, 0, 6.283); ctx.fill();
    }
    // sky: wide violet/indigo wash plus warm bloom above the sun
    const wash = (x, y, rx, ry, stops) => { ctx.save(); ctx.translate(x, y); ctx.scale(rx / ry, 1); const g = ctx.createRadialGradient(0, 0, 0, 0, 0, ry); stops.forEach(([o, c]) => g.addColorStop(o, c)); ctx.fillStyle = g; ctx.fillRect(-ry, -ry, ry * 2, ry * 2); ctx.restore(); };
    wash(sunX, sy, W * 0.75, H * 0.5, [[0, "rgba(120,70,190,.32)"], [.5, "rgba(60,50,150,.14)"], [1, "rgba(20,20,60,0)"]]);
    wash(W - sunX * 0.5, rimY(W * 0.85), W * 0.45, H * 0.32, [[0, "rgba(40,80,190,.18)"], [1, "rgba(20,40,120,0)"]]);
    wash(sunX, sy, W * 0.32, H * 0.2, [[0, "rgba(255,180,130,.55)"], [.35, "rgba(255,120,80,.2)"], [1, "rgba(255,100,60,0)"]]);
    // planet body
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2);
    const body = ctx.createLinearGradient(0, horizon - 40, 0, H);
    body.addColorStop(0, "#0d0b10"); body.addColorStop(1, "#050507"); ctx.fillStyle = body; ctx.fill();
    // faint daylight on the surface under the sun
    ctx.save(); ctx.clip();
    wash(sunX, sy + 10, W * 0.35, H * 0.16, [[0, "rgba(255,170,120,.22)"], [1, "rgba(255,170,120,0)"]]);
    ctx.restore();
    // atmosphere rim: brightest at the sun, fading along the curve
    const rim = ctx.createLinearGradient(0, 0, W, 0);
    const f = Math.min(Math.max(sunX / W, 0.001), 0.999);
    rim.addColorStop(0, "rgba(120,110,220,.35)"); rim.addColorStop(Math.max(0, f - 0.22), "rgba(200,140,200,.45)");
    rim.addColorStop(f, "rgba(255,240,225,1)"); rim.addColorStop(Math.min(1, f + 0.22), "rgba(170,150,230,.5)"); rim.addColorStop(1, "rgba(90,120,230,.4)");
    for (const [lw, a] of [[10, .08], [5, .18], [2.2, .55], [1.1, 1]]) {
      ctx.beginPath(); ctx.arc(cx, cy, R, Math.PI * 1.05, Math.PI * 1.95);
      ctx.strokeStyle = rim; ctx.globalAlpha = a; ctx.lineWidth = lw; ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // the sun itself, just cresting
    const sun = ctx.createRadialGradient(sunX, sy, 0, sunX, sy, 70);
    sun.addColorStop(0, "rgba(255,255,250,1)"); sun.addColorStop(.12, "rgba(255,225,200,.9)"); sun.addColorStop(.45, "rgba(255,150,100,.25)"); sun.addColorStop(1, "rgba(255,120,80,0)");
    ctx.fillStyle = sun; ctx.fillRect(sunX - 70, sy - 70, 140, 140);
    raf = requestAnimationFrame(draw);
  }
  raf = requestAnimationFrame(draw);
  return () => { dead = true; cancelAnimationFrame(raf); ro.disconnect(); };
}

const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

    e.preventDefault();

/* ================= CircularCarousel =================
   A 3D ring of cards. Cards bend to follow the cylinder, far cards fade
   into the page colour, inside faces show through shaded. It drifts,
   eases to a stop under the pointer and settles on a card; it can be
   thrown with momentum, swells when spun fast, leans toward the pointer,
   and clicking a card turns it to the front. WebGL, no dependencies;
   original implementation. */
const CC_VS = `attribute vec2 a_uv;
uniform vec2 u_res; uniform float u_R; uniform float u_theta; uniform vec2 u_size; uniform float u_curve;
uniform float u_tilt; uniform float u_yaw; uniform float u_persp; uniform float u_scale; uniform float u_rise;
varying vec2 v_uv; varying float v_away;
void main() {
  float y = (0.5 - a_uv.y) * u_size.y + u_rise;
  float off = (a_uv.x - 0.5) * u_size.x;
  float phi = u_theta + off / u_R;
  vec3 bent = vec3(u_R * sin(phi), y, u_R * cos(phi));
  vec3 flatP = vec3(u_R * sin(u_theta) + cos(u_theta) * off, y, u_R * cos(u_theta) - sin(u_theta) * off);
  vec3 p = mix(flatP, bent, u_curve);
  float cy = cos(u_yaw), sy = sin(u_yaw);
  p = vec3(cy * p.x + sy * p.z, p.y, -sy * p.x + cy * p.z);
  float ct = cos(u_tilt), st = sin(u_tilt);
  p = vec3(p.x, ct * p.y - st * p.z, st * p.y + ct * p.z);
  p.z -= u_R;
  float s = u_persp / (u_persp - p.z);

const CC_FS = `#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform sampler2D u_tex; uniform vec2 u_size; uniform float u_radius; uniform float u_alpha;
uniform vec3 u_fade; uniform float u_depthFade; uniform float u_inner; uniform float u_frontSign;
varying vec2 v_uv; varying float v_away;
void main() {
  bool front = (u_frontSign > 0.0) == gl_FrontFacing;

  float a = (1.0 - smoothstep(-1.0, 1.0, d)) * u_alpha;

}`;
